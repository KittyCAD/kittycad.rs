on:
  push:
    tags:
      - v*
permissions:
  contents: write
name: make-release
jobs:
  makerelease:
    name: make release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install latest stable/nightly
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | bash -s -- -y
          rustup default nightly
          rustup default stable
          rustup component add rustfmt
          rustup component add rustfmt --toolchain nightly
          rustup component add clippy
          echo PATH="${HOME}/.cargo/bin:${PATH}" >> ${GITHUB_ENV}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo index
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo build
        uses: actions/cache@v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      - name: Run make generate
        run: |
          make generate
        shell: bash
        env:
          KITTYCAD_API_TOKEN: ${{secrets.KITTYCAD_API_TOKEN}}
      # Ensure no files changed.
      - name: Ensure no files changed
        shell: bash
        run: |
          if [[ `git status --porcelain kittycad/README.md` ]]; then
            echo "Files changed, exiting";
            exit 1;
          else
            # No changes
            echo "No files changed, proceeding";
            git checkout .
          fi
      - name: Get if prerelease
        shell: bash
        id: extract_prerelease
        run: |
          if cat VERSION.txt | grep -q "rc"; then
            echo "##[set-output name=prerelease;]$(echo true)"
          else
            echo "##[set-output name=prerelease;]$(echo false)"
          fi
      - name: Publish runtime if needed
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{secrets.CARGO_TOKEN}}
        run: |
          runtime_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "openapitor-runtime") | .version')
          status=$(curl --silent --show-error --retry 3 \
            --user-agent "KittyCAD/kittycad.rs release workflow" \
            --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/openapitor-runtime/${runtime_version}")
          case "$status" in
            200)
              echo "openapitor-runtime ${runtime_version} is already published"
              ;;
            404)
              cargo publish -p openapitor-runtime
              ;;
            *)
              echo "Failed to check openapitor-runtime ${runtime_version}: HTTP ${status}" >&2
              exit 1
              ;;
          esac
      - name: Publish release
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{secrets.CARGO_TOKEN}}
        run: |
          cargo publish -p kittycad
      - name: Create a Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          prerelease: ${{steps.extract_prerelease.outputs.prerelease}}
