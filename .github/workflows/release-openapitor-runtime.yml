on:
  push:
    tags:
      - openapitor-runtime-v*
permissions:
  contents: write
name: release openapitor-runtime
jobs:
  publish:
    name: publish openapitor-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate release version
        id: version
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("openapitor-runtime/Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$GITHUB_REF_NAME" != "openapitor-runtime-v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match openapitor-runtime version ${version}." >&2
            exit 1
          fi
          if [[ "${version%%+*}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Check openapitor-runtime
        run: cargo clippy --locked -p openapitor-runtime --all-targets
      - name: Test openapitor-runtime
        run: cargo test --locked -p openapitor-runtime
      - name: Publish openapitor-runtime
        run: cargo publish --locked -p openapitor-runtime
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
      - name: Create a Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: "false"
